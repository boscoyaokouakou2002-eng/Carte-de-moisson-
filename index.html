<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Carte de la Moisson — INP-HB Centre</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#101B33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moisson INP-HB">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg: #101B33;
  --bg-deep: #0B1426;
  --surface: #1B2C50;
  --surface-line: #2E4370;
  --gold: #E8A33D;
  --gold-strong: #F5BE5C;
  --sage: #6FA287;
  --sage-strong: #8CC3A5;
  --paper: #F4EFE4;
  --text: #F2EEE3;
  --text-muted: #9FB0CE;
  --text-dim: #6C7DA0;
  --door-off: #33456F;
  --danger: #D9704F;
  --radius: 14px;
  --shadow: 0 12px 30px -12px rgba(0,0,0,0.55);
}

*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; padding:0; height:100%;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, #1A2C55 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #16244A 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:'Inter', system-ui, sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
::selection{background:var(--gold); color:#1B2C50;}

.app{max-width:920px; margin:0 auto; padding:0 0 60px;}

header.top{
  padding: 28px 20px 20px;
  position: sticky; top:0; z-index:30;
  background: linear-gradient(180deg, var(--bg-deep) 60%, rgba(16,27,51,0.88) 100%);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--surface-line);
}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color: var(--gold);
  display:flex; align-items:center; gap:8px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold); box-shadow:0 0 8px var(--gold);}
h1.title{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size: clamp(26px, 5vw, 34px);
  margin: 4px 0 2px;
  letter-spacing:-0.01em;
}
.subtitle{color:var(--text-muted); font-size:14px; margin-bottom:16px;}

.sync-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.sync-status{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--sage-strong); display:flex; align-items:center; gap:6px;}
.sync-status.err{color:var(--danger);}
.sync-btn{
  background:var(--surface); border:1px solid var(--surface-line); color:var(--text);
  padding:8px 14px; border-radius:100px; font-size:12.5px; font-weight:600;
  display:flex; align-items:center; gap:7px; cursor:pointer;
  font-family:'Inter', sans-serif;
  transition: border-color .15s, transform .1s;
}
.sync-btn:hover{border-color:var(--gold);}
.sync-btn:active{transform:scale(0.97);}
.spin{animation: spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.global-progress{margin-top:18px;}
.gp-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;}
.gp-label{font-size:12.5px; color:var(--text-muted); font-weight:500;}
.gp-numbers{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--gold-strong);}
.gp-bar{height:8px; border-radius:100px; background:var(--door-off); overflow:hidden; display:flex;}
.gp-fill-full{height:100%; background: linear-gradient(90deg, var(--sage), var(--sage-strong));}
.gp-fill-part{height:100%; background: linear-gradient(90deg, var(--gold), var(--gold-strong));}
.gp-legend{display:flex; gap:16px; margin-top:8px; font-size:11px; color:var(--text-dim); flex-wrap:wrap;}
.gp-legend span{display:flex; align-items:center; gap:5px;}
.leg-dot{width:8px; height:8px; border-radius:2px;}

.section-label{
  font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--text-dim); padding: 24px 20px 10px;
}
.buildings-grid{
  display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap:12px; padding: 0 20px;
}
.b-card{
  background: var(--surface);
  border:1px solid var(--surface-line);
  border-radius: var(--radius);
  padding:16px 16px 14px;
  cursor:pointer;
  transition: transform .12s, border-color .12s, box-shadow .12s;
  position:relative;
  overflow:hidden;
}
.b-card:hover{border-color:var(--gold); transform:translateY(-2px); box-shadow:var(--shadow);}
.b-card:active{transform:translateY(0px) scale(0.98);}
.b-card .letter{
  font-family:'Fraunces', serif; font-weight:700; font-size:30px; line-height:1;
  color:var(--paper);
}
.b-card .count{font-size:11.5px; color:var(--text-dim); margin-top:2px; font-family:'IBM Plex Mono', monospace;}
.b-card .bar{height:5px; border-radius:100px; background:var(--door-off); margin-top:12px; overflow:hidden; display:flex;}
.b-card.complete{border-color: var(--sage);}
.b-card.complete::after{
  content:"✓ complet"; position:absolute; top:12px; right:12px;
  font-family:'IBM Plex Mono', monospace; font-size:9.5px; color:var(--sage-strong);
  letter-spacing:0.04em;
}

.detail-header{padding: 16px 20px 6px; display:flex; align-items:center; gap:12px;}
.back-btn{
  background:var(--surface); border:1px solid var(--surface-line); color:var(--text);
  width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; flex-shrink:0;
}
.back-btn:hover{border-color:var(--gold);}
.detail-title{font-family:'Fraunces', serif; font-size:24px; font-weight:600;}
.detail-sub{font-size:12.5px; color:var(--text-muted); font-family:'IBM Plex Mono', monospace;}

.filters{display:flex; gap:8px; padding: 14px 20px 4px; flex-wrap:wrap;}
.chip{
  background:var(--surface); border:1px solid var(--surface-line); color:var(--text-muted);
  padding:6px 13px; border-radius:100px; font-size:12px; cursor:pointer; font-weight:500;
}
.chip.active{border-color:var(--gold); color:var(--gold-strong); background:#2A2213;}

.door-grid{
  display:grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
  gap:10px; padding: 16px 20px 30px;
}
.door{
  aspect-ratio: 3/4;
  border-radius: 7px 7px 3px 3px;
  border: 1.5px solid var(--door-off);
  background: linear-gradient(180deg, #16233F, #121D38);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding-bottom:6px;
  cursor:pointer;
  position:relative;
  transition: transform .1s, box-shadow .2s, border-color .2s;
}
.door:active{transform:scale(0.93);}
.door .knob{
  width:5px; height:5px; border-radius:50%; background:var(--door-off);
  position:absolute; right:7px; top:46%;
}
.door .num{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-dim); font-weight:600;}
.door.partial{
  border-color: var(--gold);
  background: linear-gradient(180deg, #3A2E14, #241C0C);
  box-shadow: 0 0 14px -2px rgba(232,163,61,0.35);
}
.door.partial .knob{background:var(--gold);}
.door.partial .num{color:var(--gold-strong);}
.door.full{
  border-color: var(--sage);
  background: linear-gradient(180deg, #1B3A2C, #12261D);
  box-shadow: 0 0 16px -2px rgba(111,162,135,0.45);
}
.door.full .knob{background:var(--sage-strong);}
.door.full .num{color:var(--sage-strong);}
.door.full::before{
  content:"✓"; position:absolute; top:6px; left:0; right:0; text-align:center;
  color:var(--sage-strong); font-size:13px;
}

.overlay{
  position:fixed; inset:0; background:rgba(8,13,26,0.6); backdrop-filter: blur(2px);
  z-index:50; display:flex; align-items:flex-end; justify-content:center;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.sheet{
  background: var(--surface);
  border: 1px solid var(--surface-line);
  border-bottom:none;
  width:100%; max-width:480px;
  border-radius: 20px 20px 0 0;
  padding: 22px 22px 28px;
  animation: slideUp .2s ease;
  box-shadow: 0 -20px 50px -10px rgba(0,0,0,0.5);
}
@keyframes slideUp{from{transform:translateY(30px); opacity:0} to{transform:translateY(0); opacity:1}}
.sheet-handle{width:36px; height:4px; background:var(--surface-line); border-radius:100px; margin:0 auto 18px;}
.sheet-title{font-family:'Fraunces', serif; font-size:22px; font-weight:600;}
.sheet-sub{color:var(--text-dim); font-size:12.5px; margin-top:2px; margin-bottom:20px; font-family:'IBM Plex Mono', monospace;}

.student-row{
  display:flex; align-items:center; justify-content:space-between;
  background: var(--bg-deep); border:1px solid var(--surface-line); border-radius:12px;
  padding:14px 16px; margin-bottom:10px; cursor:pointer;
}
.student-row .label{font-size:14.5px; font-weight:500;}
.toggle{width:44px; height:26px; border-radius:100px; background:var(--door-off); position:relative; transition: background .15s; flex-shrink:0;}
.toggle .knob-t{width:20px; height:20px; border-radius:50%; background:var(--paper); position:absolute; top:3px; left:3px; transition: transform .15s;}
.toggle.on{background: linear-gradient(90deg, var(--sage), var(--sage-strong));}
.toggle.on .knob-t{transform:translateX(18px);}

.name-field{margin: 16px 0 4px;}
.name-field label{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; font-family:'IBM Plex Mono', monospace;}
.name-field input{
  width:100%; margin-top:6px; background:var(--bg-deep); border:1px solid var(--surface-line);
  border-radius:10px; padding:11px 13px; color:var(--text); font-size:14.5px; font-family:'Inter', sans-serif;
}
.name-field input:focus{outline:none; border-color:var(--gold);}

.sheet-actions{display:flex; gap:10px; margin-top:20px;}
.btn{
  flex:1; padding:13px; border-radius:12px; border:none; font-weight:600; font-size:14.5px; cursor:pointer;
  font-family:'Inter', sans-serif;
}
.btn-primary{background: linear-gradient(90deg, var(--gold), var(--gold-strong)); color:#1B1206;}
.btn-primary:active{transform:scale(0.98);}
.btn-secondary{background:transparent; border:1px solid var(--surface-line); color:var(--text-muted);}

.activity{padding: 8px 20px 10px;}
.act-item{
  display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--surface-line);
  font-size:13px;
}
.act-item:last-child{border-bottom:none;}
.act-dot{width:6px;height:6px;border-radius:50%; margin-top:6px; flex-shrink:0;}
.act-text b{color:var(--paper);}
.act-time{color:var(--text-dim); font-size:11px; font-family:'IBM Plex Mono', monospace; margin-top:2px;}
.act-empty{color:var(--text-dim); font-size:13px; padding: 6px 0 14px;}

.onboard-card{max-width:380px; margin: 12vh auto; padding: 30px 26px; background:var(--surface); border:1px solid var(--surface-line); border-radius:18px; text-align:center;}
.onboard-card .eyebrow{justify-content:center;}
.onboard-card h2{font-family:'Fraunces', serif; font-size:24px; margin:10px 0 6px;}
.onboard-card p{color:var(--text-muted); font-size:13.5px; line-height:1.5; margin-bottom:20px;}

.loading-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:14px;}
.loading-screen .spin{width:26px; height:26px; border:2.5px solid var(--surface-line); border-top-color:var(--gold); border-radius:50%;}
.loading-screen p{color:var(--text-dim); font-size:13px; font-family:'IBM Plex Mono', monospace;}

.offline-banner{
  background:#3A2412; border:1px solid var(--danger); color:#F2C6A9; font-size:12px;
  padding:9px 20px; text-align:center; font-family:'IBM Plex Mono', monospace;
}

@media (max-width:420px){
  .door-grid{grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap:8px;}
  .buildings-grid{grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

    authDomain: "conquete-inphb-b00c4.firebaseapp.com",
    databaseURL: "https://conquete-inphb-b00c4-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "conquete-inphb-b00c4",
    storageBucket: "conquete-inphb-b00c4.firebasestorage.app",
    messagingSenderId: "897144718877",
    appId: "1:897144718877:web:a852a90a6a086aeb56e8f4"
  };
  firebase.initializeApp(firebaseConfig);
  window.__db = firebase.database();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
    });
  }

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useCallback} = React;

const BUILDINGS = ['A','B','C','D','E','F','G','H','J','K','L','M','N','P','R','T'];
const roomCount = (b) => b === 'B' ? 64 : 96;
const totalRooms = BUILDINGS.reduce((s,b)=>s+roomCount(b),0);

const CACHE_KEY_BUILDINGS = 'moisson-cache-buildings';
const CACHE_KEY_ACTIVITY = 'moisson-cache-activity';
const CACHE_KEY_NAME = 'moisson-user-name';

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "à l'instant";
  const m = Math.floor(s/60);
  if(m<60) return `il y a ${m} min`;
  const h = Math.floor(m/60);
  if(h<24) return `il y a ${h} h`;
  const d = Math.floor(h/24);
  return `il y a ${d} j`;
}

function readCache(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function writeCache(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

function App(){
  const [phase, setPhase] = useState('loading');
  const [userName, setUserName] = useState('');
  const [nameInput, setNameInput] = useState('');
  const [buildings, setBuildings] = useState(() => readCache(CACHE_KEY_BUILDINGS, {}));
  const [activity, setActivity] = useState(() => readCache(CACHE_KEY_ACTIVITY, []));
  const [view, setView] = useState('overview');
  const [filter, setFilter] = useState('all');
  const [sheet, setSheet] = useState(null);
  const [online, setOnline] = useState(true);

  useEffect(() => {
    const saved = readCache(CACHE_KEY_NAME, null);
    if(saved && saved.name){
      setUserName(saved.name);
      setPhase('ready');
    } else {
      setPhase('onboard');
    }

    const db = window.__db;

    const connRef = db.ref('.info/connected');
    const connHandler = (snap) => setOnline(snap.val() === true);
    connRef.on('value', connHandler);

    const buildingsRef = db.ref('buildings');
    const buildingsHandler = (snap) => {
      const val = snap.val() || {};
      setBuildings(val);
      writeCache(CACHE_KEY_BUILDINGS, val);
    };
    buildingsRef.on('value', buildingsHandler);

    const activityRef = db.ref('activity').orderByChild('ts').limitToLast(15);
    const activityHandler = (snap) => {
      const val = snap.val() || {};
      const list = Object.values(val).sort((a,b)=>b.ts-a.ts);
      setActivity(list);
      writeCache(CACHE_KEY_ACTIVITY, list);
    };
    activityRef.on('value', activityHandler);

    return () => {
      connRef.off('value', connHandler);
      buildingsRef.off('value', buildingsHandler);
      activityRef.off('value', activityHandler);
    };
  }, []);

  const confirmName = () => {
    const n = nameInput.trim();
    const finalName = n || 'Anonyme';
    setUserName(finalName);
    writeCache(CACHE_KEY_NAME, {name: finalName});
    setPhase('ready');
  };

  const openRoom = (building, room) => setSheet({building, room});

  const saveRoom = (building, room, s1, s2) => {
    const status = (s1?1:0) + (s2?1:0);
    // optimistic local update
    setBuildings(prev => ({...prev, [building]: {...(prev[building]||{}), [room]: status}}));

    const db = window.__db;
    db.ref(`buildings/${building}/${room}`).set(status).catch(()=>{});

    const studentsText = status===0 ? 'aucun étudiant' : status===1 ? '1 étudiant' : 'les 2 étudiants';
    const entry = {building, room, status, name: userName, ts: Date.now(), text: `${building}-${room} · ${studentsText}`};
    db.ref('activity').push(entry).catch(()=>{});

    setSheet(null);
  };

  const forceSync = () => {
    try{ window.__db.goOnline(); }catch(e){}
  };

  if(phase === 'loading'){
    return (
      <div className="loading-screen">
        <div className="spin"></div>
        <p>Chargement de la carte de la moisson…</p>
      </div>
    );
  }

  if(phase === 'onboard'){
    return (
      <div className="app">
        <div className="onboard-card">
          <div className="eyebrow"><span className="dot"></span>INP-HB CENTRE</div>
          <h2>Bienvenue, frère</h2>
          <p>Indique ton prénom pour que les autres sachent qui a visité quelle chambre. Tu peux laisser vide.</p>
          <div className="name-field">
            <input
              placeholder="Ton prénom"
              value={nameInput}
              onChange={e=>setNameInput(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter') confirmName();}}
              autoFocus
            />
          </div>
          <div className="sheet-actions">
            <button className="btn btn-primary" onClick={confirmName}>Commencer</button>
          </div>
        </div>
      </div>
    );
  }

  let visitedRooms = 0, partialRooms = 0, studentsReached = 0;
  const totalStudents = totalRooms * 2;
  BUILDINGS.forEach(b => {
    const data = buildings[b] || {};
    Object.values(data).forEach(st => {
      if(st === 2) visitedRooms++;
      if(st === 1) partialRooms++;
      studentsReached += (st||0);
    });
  });
  const fullPct = totalRooms ? (visitedRooms/totalRooms*100) : 0;
  const partPct = totalRooms ? (partialRooms/totalRooms*100) : 0;

  return (
    <div className="app">
      {!online && (
        <div className="offline-banner">⚠ Hors ligne — dernières données connues affichées. Tes visites cochées ici s'enverront automatiquement au retour du réseau (garde l'appli ouverte).</div>
      )}
      <header className="top">
        <div className="eyebrow"><span className="dot"></span>INP-HB CENTRE · SUIVI D'ÉVANGÉLISATION</div>
        <h1 className="title">Carte de la Moisson</h1>
        <div className="subtitle">Salut {userName} — {totalRooms} chambres à couvrir avant la fin de l'année</div>

        <div className="sync-row">
          <div className={"sync-status" + (online ? "" : " err")}>
            {online ? "● en ligne · synchronisé" : "● hors ligne"}
          </div>
          <button className="sync-btn" onClick={forceSync}>
            <span>⟳</span>
            Reconnecter
          </button>
        </div>

        <div className="global-progress">
          <div className="gp-row">
            <span className="gp-label">Progression globale</span>
            <span className="gp-numbers">{visitedRooms}/{totalRooms} chambres · {studentsReached}/{totalStudents} étudiants</span>
          </div>
          <div className="gp-bar">
            <div className="gp-fill-full" style={{width: fullPct+'%'}}></div>
            <div className="gp-fill-part" style={{width: partPct+'%'}}></div>
          </div>
          <div className="gp-legend">
            <span><span className="leg-dot" style={{background:'var(--sage)'}}></span>Complète (2 étudiants)</span>
            <span><span className="leg-dot" style={{background:'var(--gold)'}}></span>Partielle (1 étudiant)</span>
            <span><span className="leg-dot" style={{background:'var(--door-off)'}}></span>Pas encore visitée</span>
          </div>
        </div>
      </header>

      {view === 'overview' ? (
        <OverviewView buildings={buildings} onOpen={setView} />
      ) : (
        <DetailView
          letter={view}
          data={buildings[view] || {}}
          filter={filter}
          setFilter={setFilter}
          onBack={()=>{setView('overview'); setFilter('all');}}
          onOpenRoom={(room)=>openRoom(view, room)}
        />
      )}

      <div className="section-label">Activité récente</div>
      <div className="activity">
        {activity.length === 0 && <div className="act-empty">Aucune visite enregistrée pour l'instant.</div>}
        {activity.slice(0,10).map((a,i) => (
          <div className="act-item" key={i}>
            <div className="act-dot" style={{background: a.status===2 ? 'var(--sage)' : a.status===1 ? 'var(--gold)' : 'var(--door-off)'}}></div>
            <div>
              <div className="act-text"><b>{a.name || 'Anonyme'}</b> — {a.text}</div>
              <div className="act-time">{timeAgo(a.ts)}</div>
            </div>
          </div>
        ))}
      </div>

      {sheet && (
        <RoomSheet
          sheet={sheet}
          currentStatus={(buildings[sheet.building] || {})[sheet.room] || 0}
          userName={userName}
          onClose={()=>setSheet(null)}
          onSave={saveRoom}
        />
      )}
    </div>
  );
}

function OverviewView({buildings, onOpen}){
  return (
    <>
      <div className="section-label">Bâtiments</div>
      <div className="buildings-grid">
        {BUILDINGS.map(b => {
          const data = buildings[b] || {};
          const total = roomCount(b);
          let full=0, part=0;
          Object.values(data).forEach(st=>{ if(st===2) full++; else if(st===1) part++; });
          const fullPct = total ? full/total*100 : 0;
          const partPct = total ? part/total*100 : 0;
          const isComplete = full === total;
          return (
            <div className={"b-card" + (isComplete ? " complete" : "")} key={b} onClick={()=>onOpen(b)}>
              <div className="letter">{b}</div>
              <div className="count">{full}/{total} portes</div>
              <div className="bar">
                <div className="gp-fill-full" style={{width: fullPct+'%'}}></div>
                <div className="gp-fill-part" style={{width: partPct+'%'}}></div>
              </div>
            </div>
          );
        })}
      </div>
    </>
  );
}

function DetailView({letter, data, filter, setFilter, onBack, onOpenRoom}){
  const total = roomCount(letter);
  const rooms = Array.from({length: total}, (_,i)=> String(i+1));
  const filtered = rooms.filter(r => {
    const st = data[r] || 0;
    if(filter==='all') return true;
    if(filter==='none') return st===0;
    if(filter==='partial') return st===1;
    if(filter==='full') return st===2;
    return true;
  });
  let full=0, part=0;
  rooms.forEach(r=>{ const st=data[r]||0; if(st===2) full++; else if(st===1) part++; });

  return (
    <>
      <div className="detail-header">
        <button className="back-btn" onClick={onBack}>←</button>
        <div>
          <div className="detail-title">Bâtiment {letter}</div>
          <div className="detail-sub">{full}/{total} complètes · {part} partielles</div>
        </div>
      </div>
      <div className="filters">
        {[['all','Toutes'],['none','Non visitées'],['partial','Partielles'],['full','Complètes']].map(([k,label])=>(
          <div key={k} className={"chip"+(filter===k?" active":"")} onClick={()=>setFilter(k)}>{label}</div>
        ))}
      </div>
      <div className="door-grid">
        {filtered.map(r => {
          const st = data[r] || 0;
          return (
            <div
              key={r}
              className={"door" + (st===1?" partial":"") + (st===2?" full":"")}
              onClick={()=>onOpenRoom(r)}
            >
              <div className="knob"></div>
              <div className="num">{letter}-{r}</div>
            </div>
          );
        })}
      </div>
    </>
  );
}

function RoomSheet({sheet, currentStatus, userName, onClose, onSave}){
  const [s1, setS1] = useState(currentStatus >= 1);
  const [s2, setS2] = useState(currentStatus === 2);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-handle"></div>
        <div className="sheet-title">Chambre {sheet.building}-{sheet.room}</div>
        <div className="sheet-sub">Qui a été touché dans cette chambre ?</div>

        <div className="student-row" onClick={()=>setS1(!s1)}>
          <span className="label">Étudiant 1 prêché</span>
          <div className={"toggle"+(s1?" on":"")}><div className="knob-t"></div></div>
        </div>
        <div className="student-row" onClick={()=>setS2(!s2)}>
          <span className="label">Étudiant 2 prêché</span>
          <div className={"toggle"+(s2?" on":"")}><div className="knob-t"></div></div>
        </div>

        <div className="sheet-actions">
          <button className="btn btn-secondary" onClick={onClose}>Annuler</button>
          <button className="btn btn-primary" onClick={()=>onSave(sheet.building, sheet.room, s1, s2)}>Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
